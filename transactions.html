<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Network Operations | KeetaView</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="transactions-page-body">

<header class="home-header">
    <a class="home-brand" href="index.html">
        Keeta<span>View</span>
    </a>

    <form id="detailSearchForm" class="home-search">
        <select id="detailSearchType" aria-label="Search type">
            <option value="transaction" selected>Transaction</option>
            <option value="address">Address</option>
            <option value="block">Block</option>
            <option value="asset">Asset</option>
            <option value="anchor">Anchor</option>
        </select>

        <input
            id="detailSearchInput"
            type="search"
            placeholder="Search address, transaction, block, or asset"
            aria-label="Search value"
        >

        <button type="submit">Search</button>
    </form>

    <div class="home-header-actions">
        <button
            class="header-control"
            type="button"
            aria-label="Settings are coming in the next milestone"
            title="Settings are coming next"
        >
            ⚙
        </button>

        <button
            id="themeToggle"
            class="header-control"
            type="button"
            aria-label="Switch appearance"
        >
            Theme
        </button>
    </div>
</header>

<nav class="home-navigation" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="blocks.html">Blocks</a>
    <a href="transactions.html" class="active">Transactions</a>
    <a href="addresses.html">Addresses</a>
    <a href="assets.html">Assets</a>
    <a href="analytics.html">Analytics</a>
    <a href="status.html">Status</a>
</nav>

<main class="transactions-dashboard">
    <header class="transactions-title-card">
        <div>
            <p class="home-eyebrow">KEETAVIEW INDEX</p>
            <h1>Network Operations</h1>
            <p>
                Browse every indexed action recorded on the Keeta Network.
            </p>
        </div>

        <div class="transaction-filter-controls">
            <label class="transaction-filter">
                <span>Operation view</span>
                <select id="transactionScope">
                    <option value="all">All Operations</option>
                    <option value="transfers">Transfers</option>
                    <option value="anchors">Anchors</option>
                </select>
            </label>

            <label
                id="anchorStatusFilter"
                class="transaction-filter"
                hidden
            >
                <span>Anchor status</span>
                <select id="anchorStatus">
                    <option value="all">All Anchors</option>
                    <option value="verified">Verified</option>
                    <option value="unsigned">Unsigned</option>
                    <option value="invalid">Invalid</option>
                </select>
            </label>

            <label class="transaction-filter transaction-filter--search">
                <span>Search the full index</span>
                <input
                    id="transactionFilter"
                    type="search"
                    placeholder="Full block hash, address, asset, or type"
                    autocomplete="off"
                >
            </label>
        </div>
    </header>

    <section
        class="transactions-list-card"
        aria-labelledby="transactionsListTitle"
    >
        <header class="transactions-card-header">
            <div>
                <p class="home-eyebrow">LATEST INDEXED</p>
                <h2 id="transactionsListTitle">Recorded Operations</h2>
            </div>

            <span
                id="transactionResultCount"
                class="transaction-result-count"
            >
                Loading transactions…
            </span>
        </header>

        <div class="transaction-table-scroll">
            <div class="transaction-directory-table">
                <div class="transaction-directory-header" aria-hidden="true">
                    <span>Block</span>
                    <span>Age</span>
                    <span>Type</span>
                    <span>From</span>
                    <span>Details</span>
                </div>

                <div
                    id="transactionsPageList"
                    class="transaction-directory-list"
                    aria-live="polite"
                >
                    <p class="transactions-empty">
                        Loading transactions…
                    </p>
                </div>
            </div>
        </div>

        <footer class="transaction-pagination">
            <button id="previousPage" type="button">← Previous</button>
            <span id="pageNumber">Page 1</span>
            <button id="nextPage" type="button">Next →</button>
        </footer>
    </section>
</main>

<script src="https://static.test.keeta.com/keetanet-browser.js"></script>
<script src="shared.js"></script>
<script src="background.js"></script>
<script src="transactions.js"></script>
</body>
</html>
