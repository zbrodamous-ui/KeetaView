<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Address Details | KeetaView</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="detail-page-body">

<header class="home-header">
    <a class="home-brand" href="index.html">
        Keeta<span>View</span>
    </a>

    <form id="detailSearchForm" class="home-search">
        <select id="detailSearchType" aria-label="Search type">
            <option value="transaction">Transaction</option>
            <option value="address" selected>Address</option>
            <option value="block">Block</option>
            <option value="asset">Asset</option>
        </select>

        <input
            id="detailSearchInput"
            type="search"
            placeholder="Search address, transaction, block, or asset"
            aria-label="Search value"
        >

        <button type="submit">Search</button>
    </form>

    <div class="home-header-actions">
        <button
            class="header-control"
            type="button"
            aria-label="Settings are coming in the next milestone"
            title="Settings are coming next"
        >
            ⚙
        </button>

        <button
            id="themeToggle"
            class="header-control"
            type="button"
            aria-label="Switch appearance"
        >
            Theme
        </button>
    </div>
</header>

<nav class="home-navigation" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="blocks.html">Blocks</a>
    <a href="transactions.html">Transactions</a>
    <a href="addresses.html" class="active">Addresses</a>
    <a href="assets.html">Assets</a>
    <a href="analytics.html">Analytics</a>
    <a href="status.html">Status</a>
</nav>

<main class="address-page detail-shell address-detail-shell">
    <a class="detail-back-link" href="index.html">← Back to Search</a>

    <article class="block-card address-card">
        <h1 id="addressTitle">Address Details</h1>

        <div class="details-grid" id="addressDetails">
            Loading address...
        </div>

        <h2 class="section-title" id="balancesTitle">Balances</h2>

        <div id="balancesList">
            Loading balances...
        </div>

        <section id="addressAnchors" hidden>
            <div class="address-section-heading">
                <div>
                    <p class="home-eyebrow">ANCHOR ACTIVITY</p>
                    <h2 class="section-title">Indexed Anchors</h2>
                </div>
                <a href="transactions.html?view=anchors">Browse all</a>
            </div>

            <div id="addressAnchorList" class="address-anchor-list"></div>
        </section>

        <h2 class="section-title">Recent Activity</h2>

        <div class="address-activity-scroll">
            <div class="activity-table">
                <div class="activity-table-header">
                    <span>Block</span>
                    <span>Age</span>
                    <span>Type</span>
                    <span>From</span>
                    <span>To</span>
                    <span>Amount</span>
                </div>

                <div id="addressActivityList">
                    Loading activity...
                </div>
            </div>
        </div>
    </article>
</main>

<script src="https://static.test.keeta.com/keetanet-browser.js"></script>
<script src="shared.js"></script>
<script src="background.js"></script>
<script src="address.js"></script>
</body>
</html>
